<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="52%" stop-color="#0B162C"/>
      <stop offset="100%" stop-color="#07223B"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="82%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="62%" cy="85%" r="32%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#bg)" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#glowViolet)"/>

  <!-- Top Accent Bar -->
  <rect x="48" y="2" width="260" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Right-Side Decorative Network + Connectome Graphic -->
  <g transform="translate(760, 26)">
    <!-- Outer radar / orbital rings -->
    <circle cx="220" cy="108" r="96" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="220" cy="108" r="64" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.45"/>

    <!-- Graph edges -->
    <g stroke="#38BDF8" stroke-opacity="0.34" stroke-width="1.3">
      <line x1="120" y1="68" x2="190" y2="46"/>
      <line x1="190" y1="46" x2="265" y2="62"/>
      <line x1="265" y1="62" x2="322" y2="102"/>
      <line x1="120" y1="68" x2="168" y2="120"/>
      <line x1="168" y1="120" x2="245" y2="114"/>
      <line x1="245" y1="114" x2="322" y2="102"/>
      <line x1="168" y1="120" x2="198" y2="174"/>
      <line x1="245" y1="114" x2="280" y2="170"/>
      <line x1="198" y1="174" x2="280" y2="170"/>
      <line x1="190" y1="46" x2="245" y2="114"/>
    </g>

    <!-- Animated FEC Packet / Spike Stream Wave -->
    <path d="M 70 116 Q 116 74, 168 120 T 245 114 T 344 102" fill="none" stroke="url(#waveGrad)" stroke-width="2.8" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="56" to="0" dur="2.6s" repeatCount="indefinite"/>
    </path>

    <!-- Graph Nodes -->
    <circle cx="120" cy="68" r="5" fill="#0EA5E9"/>
    <circle cx="190" cy="46" r="6" fill="#22D3EE">
      <animate attributeName="r" values="5;7.5;5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="265" cy="62" r="5" fill="#38BDF8"/>
    <circle cx="168" cy="120" r="6.5" fill="#10B981">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="245" cy="114" r="7" fill="#22D3EE"/>
    <circle cx="322" cy="102" r="6" fill="#10B981"/>
    <circle cx="198" cy="174" r="4.5" fill="#818CF8"/>
    <circle cx="280" cy="170" r="5" fill="#38BDF8"/>

    <!-- Mini Telemetry HUD Tag -->
    <rect x="114" y="224" width="216" height="30" rx="8" fill="#091526" fill-opacity="0.92" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="131" cy="239" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="143" y="243" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">FEC + AEAD  ·  SHA-256 OK</text>
  </g>

  <!-- Left Content -->
  <!-- Top Eyebrow Pill -->
  <rect x="48" y="38" width="388" height="28" rx="14" fill="#0C1E36" stroke="#1E40AF" stroke-width="1"/>
  <circle cx="65" cy="52" r="4" fill="#22D3EE"/>
  <text x="78" y="56" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#7DD3FC">SYSTEMS  ·  EMBEDDED HARDWARE  ·  GPU SIMULATION</text>

  <!-- Name & Handle -->
  <text x="48" y="122" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC">Amandeep Bains</text>
  <text x="418" y="120" font-family="Consolas, 'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#38BDF8">@indian-aman</text>

  <!-- Tagline -->
  <text x="48" y="164" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="17.5" fill="#CBD5E1">Building loss-resilient wireless transport protocols, zero-heap C99 / ESP32</text>
  <text x="48" y="191" font-family="'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="17.5" fill="#CBD5E1">embedded systems, and GPU-accelerated whole-brain connectome simulations.</text>

  <!-- Bottom Highlight Pills -->
  <g transform="translate(48, 236)">
    <rect x="0" y="0" width="246" height="44" rx="10" fill="#0B1D35" stroke="#0284C7" stroke-width="1.1"/>
    <text x="16" y="19" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">PROTOCOL ENGINEERING</text>
    <text x="16" y="35" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">NLTP v1.2 · Cauchy FEC · CGNAT</text>

    <rect x="260" y="0" width="256" height="44" rx="10" fill="#0B1D35" stroke="#10B981" stroke-width="1.1" stroke-opacity="0.75"/>
    <text x="276" y="19" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">COMPUTATIONAL NEURO</text>
    <text x="276" y="35" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">Whole-CNS GPU · CUDA / Triton</text>

    <rect x="530" y="0" width="232" height="44" rx="10" fill="#0B1D35" stroke="#6366F1" stroke-width="1.1" stroke-opacity="0.8"/>
    <text x="546" y="19" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#A5B4FC">HARDWARE &amp; CAD</text>
    <text x="546" y="35" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">ESP32 · ANSI C99 · KiCad · 3D</text>
  </g>
</svg>
