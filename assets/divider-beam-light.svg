<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" fill="none">
  <line x1="60" y1="22" x2="1140" y2="22" stroke="#B88222" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="6 6"/>
  <!-- Left &amp; Right Racing Comets -->
  <rect y="20.5" width="76" height="3" rx="1.5" fill="#B88222">
    <animate attributeName="x" values="560;40" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect y="20.5" width="76" height="3" rx="1.5" fill="#C9932E">
    <animate attributeName="x" values="564;1084" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Central Rotating Diamond Reticle -->
  <g transform="translate(600, 22)">
    <g>
      <rect x="-8" y="-8" width="16" height="16" rx="3" stroke="#C9932E" stroke-width="1.6" fill="#F2EFE8" fill-opacity="0.84"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#B88222">
      <animate attributeName="r" values="2;4.2;2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
