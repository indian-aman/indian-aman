<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585 304" width="585" height="304" fill="none">
  <rect x="6" y="6" width="573" height="292" rx="20" fill="#FAF9F5" fill-opacity="0.96" stroke="#B88222" stroke-opacity="0.32" stroke-width="1.5"/>
  <rect x="32" y="5.5" width="130" height="3" rx="1.5" fill="#B88222">
    <animate attributeName="x" values="410;32;410" dur="6.8s" repeatCount="indefinite"/>
  </rect>

  <text x="32" y="42" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#B88222">AUTONOMOUS MARINE ROBOTICS &amp; BATHYMETRY</text>
  <rect x="444" y="24" width="109" height="24" rx="12" fill="#F5ECD8" fill-opacity="0.88" stroke="#B88222" stroke-opacity="0.5" stroke-width="1"/>
  <text x="498.5" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#B88222">ROS 2 Jazzy</text>

  <text x="32" y="74" font-family="'Segoe UI', Inter, sans-serif" font-size="23" font-weight="800" fill="#11141B">hydro-usv-ros2</text>
  <text x="32" y="100" font-family="'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#343A46">3-tier autonomous hydrographic survey craft combining MOOS-IvP</text>
  <text x="32" y="119" font-family="'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#343A46">mission autonomy, ROS 2 Nav2 EKF, and CUDA 512-beam sonar gridding.</text>

  <!-- Live Sweeping Multibeam Sonar (MBES) Viewport -->
  <rect x="32" y="136" width="521" height="114" rx="14" fill="#F2EFE8" fill-opacity="0.84" stroke="#DDD8CC" stroke-opacity="0.90" stroke-width="1"/>

  <!-- Left Mini Sonar Cross-Section -->
  <line x1="48" y1="158" x2="188" y2="158" stroke="#B88222" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Seabed Terrain Profile -->
  <path d="M 48 232 Q 82 212, 114 226 T 188 220" stroke="#C9932E" stroke-width="2" fill="none"/>
  <!-- Sweeping 512-Beam MBES Fan from USV -->
  <g transform="translate(118, 158)">
    <g>
      <polygon points="0,0 -34,68 34,68" fill="#B88222" fill-opacity="0.22" stroke="#B88222" stroke-opacity="0.55" stroke-width="1"/>
      <animateTransform attributeName="transform" type="rotate" values="-16;16;-16" dur="3.0s" repeatCount="indefinite"/>
    </g>
    <rect x="-14" y="-6" width="28" height="8" rx="3" fill="#C9932E"/>
  </g>

  <!-- Right Specs -->
  <text x="210" y="172" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#B88222">▸ 10 ROS 2 Packages + Gazebo Sim</text>
  <text x="210" y="198" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#C9932E">▸ CUDA 512-Beam MBES Raytracing</text>
  <text x="210" y="224" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#2B313D">▸ COLREGs Evasion + Live Web Sim</text>

  <!-- Footer -->
  <circle cx="38" cy="274" r="5" fill="#2B313D"/>
  <text x="49" y="278" font-family="'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#5E6573">C++17 · ROS 2 Jazzy · CUDA · MOOS-IvP</text>
  <text x="553" y="278" text-anchor="end" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#B88222">Enter Repo →</text>
</svg>
