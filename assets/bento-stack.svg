    <rect x="20" y="0" width="76" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="20" y="34" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#22D3EE">02 // NETWORKING &amp; CRYPTO</text>
    <text x="20" y="66" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">• Custom UDP Transport Engines</text>
