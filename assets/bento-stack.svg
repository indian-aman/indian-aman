    <text x="20" y="178" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">• Large Sparse Graph Analytics</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(911, 2)">
