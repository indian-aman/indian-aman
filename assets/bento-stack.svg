    <rect x="20" y="0" width="76" height="3" rx="1.5" fill="#0EA5E9"/>
    <text x="20" y="34" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#38BDF8">01 // EMBEDDED &amp; HARDWARE</text>
    <text x="20" y="66" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">• ANSI C99 (Zero-Heap Core)</text>
    <text x="20" y="94" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">• ESP32 / ESP-IDF / Arduino</text>
    <text x="20" y="122" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">• PlatformIO &amp; Bare-Metal SDKs</text>
    <text x="20" y="150" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">• KiCad PCB &amp; Analog Frontends</text>
    <text x="20" y="178" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">• Blender 3D &amp; Support-Free CAD</text>
  </g>

  <!-- Card 2 -->
