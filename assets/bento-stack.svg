<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 218" width="1200" height="218">
  <defs>
    <linearGradient id="bbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E1C"/>
      <stop offset="100%" stop-color="#0B172A"/>
    </linearGradient>
  </defs>

  <!-- Card 1 -->
  <g transform="translate(2, 2)">
