    <rect x="20" y="0" width="76" height="3" rx="1.5" fill="#10B981"/>
    <text x="20" y="34" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#34D399">03 // GPU &amp; SIMULATION</text>
