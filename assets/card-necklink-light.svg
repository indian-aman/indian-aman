<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585 304" width="585" height="304" fill="none">
  <rect x="6" y="6" width="573" height="292" rx="20" fill="#F1F5F9" fill-opacity="0.76" stroke="#0284C7" stroke-opacity="0.32" stroke-width="1.5"/>
  <rect x="32" y="5.5" width="130" height="3" rx="1.5" fill="#0284C7">
    <animate attributeName="x" values="32;410;32" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="32" y="42" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#0284C7">FLAGSHIP WIRELESS &amp; SATELLITE TRANSPORT</text>
  <rect x="468" y="24" width="85" height="24" rx="12" fill="#E0F2FE" fill-opacity="0.88" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1"/>
  <text x="510.5" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#0284C7">v1.2.0</text>

  <text x="32" y="74" font-family="'Segoe UI', Inter, sans-serif" font-size="23" font-weight="800" fill="#0B1324">necklink  (NLTP)</text>
  <text x="32" y="100" font-family="'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#334155">Bidirectional UDP file &amp; telemetry engine with GF(2^8) Cauchy FEC,</text>
  <text x="32" y="119" font-family="'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#334155">1-RTT packet-train pacing, ChaCha20-Poly1305 &amp; 4G CGNAT traversal.</text>

  <!-- Live Animated FEC Packet-Train Telemetry Viewport -->
  <rect x="32" y="136" width="521" height="114" rx="14" fill="#FFFFFF" fill-opacity="0.84" stroke="#CBD5E1" stroke-opacity="0.90" stroke-width="1"/>

  <!-- Sender -> Loss Zone -> Receiver Animation -->
  <rect x="48" y="150" width="76" height="26" rx="7" fill="#E0F2FE" stroke="#0284C7" stroke-opacity="0.55"/>
  <text x="86" y="167" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#0284C7">ESP32 TX</text>

  <line x1="126" y1="163" x2="452" y2="163" stroke="#0284C7" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 20% Loss Hazard Box -->
  <rect x="242" y="148" width="96" height="30" rx="8" stroke="#E11D48" stroke-opacity="0.55" stroke-dasharray="3 3"/>
  <text x="290" y="167" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#E11D48">20% RF LOSS</text>

  <!-- Streaming Data + FEC Healing Packets -->
  <rect y="158" width="16" height="10" rx="3" fill="#0284C7">
    <animate attributeName="x" values="130;440" dur="2.1s" repeatCount="indefinite"/>
  </rect>
  <rect y="158" width="16" height="10" rx="3" fill="#0284C7">
    <animate attributeName="x" values="130;440" dur="2.1s" begin="0.7s" repeatCount="indefinite"/>
  </rect>
  <!-- FEC Parity Packet turning Emerald after healing drop! -->
  <rect y="158" width="20" height="10" rx="3" fill="#059669">
    <animate attributeName="x" values="130;440" dur="2.1s" begin="1.4s" repeatCount="indefinite"/>
  </rect>

  <rect x="454" y="150" width="84" height="26" rx="7" fill="#E0F2FE" stroke="#059669" stroke-opacity="0.6"/>
  <text x="496" y="167" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#059669">FEC HEAL</text>

  <!-- Benchmark Metrics -->
  <text x="48" y="203" font-family="Consolas, monospace" font-size="11" fill="#475569">1 MB @ 20% Loss:</text>
  <rect x="174" y="193" width="136" height="11" rx="4" fill="#0284C7">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="318" y="203" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#0284C7">6.36s (vs TCP BBR 8.31s)</text>

  <text x="48" y="229" font-family="Consolas, monospace" font-size="11" fill="#475569">ESP32 60 KB Enc:</text>
  <rect x="174" y="219" width="154" height="11" rx="4" fill="#059669"/>
  <text x="336" y="229" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#059669">3.04 Mbps (5.5x &gt; ESP-NOW)</text>

  <!-- Footer -->
  <circle cx="38" cy="274" r="5" fill="#3776AB"/>
  <text x="49" y="278" font-family="'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#475569">Python · Zero-Heap C99 · ESP32</text>
  <text x="553" y="278" text-anchor="end" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0284C7">Enter Repo →</text>
</svg>
