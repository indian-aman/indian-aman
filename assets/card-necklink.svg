<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585 268" width="585" height="268">
  <defs>
    <linearGradient id="cbg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081121"/>
      <stop offset="100%" stop-color="#0C1D36"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="582" height="265" rx="16" fill="url(#cbg1)" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="28" y="1.5" width="140" height="3" rx="1.5" fill="#0EA5E9"/>

  <!-- Header -->
  <text x="28" y="38" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8">FLAGSHIP TRANSPORT LIBRARY</text>
  <rect x="478" y="21" width="79" height="24" rx="12" fill="#082F49" stroke="#0EA5E9" stroke-width="1"/>
  <text x="517.5" y="37" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#7DD3FC">v1.2.0</text>

  <text x="28" y="68" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">necklink  (NLTP)</text>

  <!-- Description -->
  <text x="28" y="95" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#CBD5E1">Loss-resilient two-way UDP file &amp; telemetry transport with GF(2^8) Cauchy</text>
  <text x="28" y="114" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#CBD5E1">FEC, 1-RTT packet-train pacing, ChaCha20-Poly1305 &amp; 4G CGNAT traversal.</text>

  <!-- Mini Benchmark Bars Box -->
  <rect x="28" y="130" width="529" height="84" rx="10" fill="#060D1A" stroke="#1E293B" stroke-width="1"/>
  <text x="42" y="150" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">1 MB @ 20% Loss:</text>
  <rect x="166" y="140" width="138" height="12" rx="4" fill="#0EA5E9"/>
  <text x="312" y="150" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">NLTP 6.36s  (vs TCP BBR 8.31s)</text>

  <text x="42" y="175" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">ESP32 60 KB Enc:</text>
  <rect x="166" y="165" width="152" height="12" rx="4" fill="#10B981"/>
  <text x="326" y="175" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">3.04 Mbps  (5.5x &gt; ESP-NOW)</text>

  <text x="42" y="200" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">Verified Suite:</text>
  <text x="166" y="200" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#E2E8F0">72/72 C↔Py  ·  48/48 Radio  ·  18/18 NAT</text>

  <!-- Footer -->
  <circle cx="34" cy="240" r="5" fill="#3776AB"/>
  <text x="45" y="244" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#94A3B8">Python</text>

  <circle cx="110" cy="240" r="5" fill="#0EA5E9"/>
  <text x="121" y="244" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#94A3B8">ANSI C99 (Zero-Heap)</text>

  <circle cx="275" cy="240" r="5" fill="#00979D"/>
  <text x="286" y="244" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#94A3B8">Arduino / ESP32</text>

  <text x="557" y="244" text-anchor="end" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8">Explore Repo →</text>
</svg>
